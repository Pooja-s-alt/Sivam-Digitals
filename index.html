    function Hero({ onOpenBooking }) {
      const { heroSlides, contactInfo } = useData();
      const [currentSlide, setCurrentSlide] = useState(0);
      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      const slides = heroSlides && heroSlides.length > 0 ? heroSlides : INITIAL_HERO_SLIDES;

      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentSlide((prev) => (prev + 1) % slides.length);
        }, 2500);
        return () => clearInterval(timer);
      }, [slides.length]);

      const handlePrev = () => setCurrentSlide((prev) => (prev === 0 ? slides.length - 1 : prev - 1));
      const handleNext = () => setCurrentSlide((prev) => (prev + 1) % slides.length);

      const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
      const handleTouchEnd = (e) => {
        touchEndX.current = e.changedTouches[0].clientX;
        const diff = touchStartX.current - touchEndX.current;
        if (Math.abs(diff) > 40) {
          if (diff > 0) handleNext();
          else handlePrev();
        }
      };

      const activeSlideData = slides[currentSlide % slides.length] || slides[0];
      const waUrl = `https://api.whatsapp.com/send?phone=${contactInfo.whatsappRaw}&text=${encodeURIComponent("Hello Sivam Digital Studio! 📸 I would like to enquire about your photography, album making & frame services. ✨")}`;

    // 2. TRUST STATS & ABOUT COMPONENT (#about)
    function TrustStats() {
      const [counts, setCounts] = useState(siteConfig.stats.map(() => 0));
      const sectionRef = useRef(null);
      const [animated, setAnimated] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting && !animated) {
            setAnimated(true);
            siteConfig.stats.forEach((stat, idx) => {
              let current = 0;
              const step = stat.number / 30;
              const timer = setInterval(() => {
                current += step;
                if (current >= stat.number) {
                  current = stat.number;
                  clearInterval(timer);
                }
                setCounts(prev => {
                  const next = [...prev];
                  next[idx] = Math.floor(current);
                  return next;
                });
              }, 50);
            });
          }
        }, { threshold: 0.2 });

        if (sectionRef.current) observer.observe(sectionRef.current);
        return () => observer.disconnect();
      }, [animated]);

      return (
        <section ref={sectionRef} className="trust-stats-section">
          <div className="container">
            <div className="stats-grid">
              {siteConfig.stats.map((stat, idx) => (
                <div key={idx} className={`stat-item reveal-up delay-${(idx % 4) + 1}`}>
                  <div className="stat-number">{counts[idx]}{stat.suffix}</div>
                  <div className="stat-label">{stat.label}</div>
                  <div className="stat-desc">{stat.desc}</div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

                      </div>
                    </div>
                  )}

                  {/* Bookings */}
                  {activeTab === 'bookings' && (
                    <div>
                      <div className="admin-section-header"><h3 className="admin-section-title">Customer Bookings & Enquiries</h3></div>
                      <div style={{ overflowX: 'auto' }}>

      const { contactInfo } = useData();
      return (
        <React.Fragment>
          <div className="desktop-floating-actions">
            <a href="https://www.instagram.com/sivam_studio_rmd/" target="_blank" rel="noopener noreferrer" className="float-action-btn float-insta" title="Instagram Page" style={{ background: 'linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%)', color: '#fff' }}>
              <Icon name="instagram" size={22} color="#fff" />
            </a>

              <Icon name="message-square" size={24} />
            </a>
            <a href={`tel:${contactInfo.phoneRaw}`} className="float-action-btn float-call" title="Call Sivam Digital">
              <Icon name="phone" size={22} />
            </a>
          </div>

            <div className="mobile-bar-actions">
              <a href={`tel:${contactInfo.phoneRaw}`} className="btn btn-dark" style={{ flex: 1, padding: '0.6rem' }}>
                <Icon name="phone" size={14} /><span>Call</span>
              </a>
              <a href={`https://api.whatsapp.com/send?phone=${contactInfo.whatsappRaw}`} target="_blank" rel="noopener noreferrer" className="btn btn-dark" style={{ flex: 1, padding: '0.6rem', color: '#25D366' }}>
                <Icon name="message-square" size={14} /><span>WhatsApp</span>
              </a>
              <button className="btn btn-gold" style={{ flex: 1.2, padding: '0.6rem' }} onClick={() => onOpenBooking()}>
                <Icon name="calendar" size={14} /><span>Book Now</span>
              </button>
            </div>
          </div>
        </React.Fragment>
      );

    // MAIN APP COMPONENT STRICTLY ALIGNED WITH HEADER MENU ORDER
    function AppContent() {
      const [bookingOpen, setBookingOpen] = useState(false);
      const [selectedService, setSelectedService] = useState('Wedding Photography');
      const [lbImages, setLbImages] = useState([]);
      const [lbIndex, setLbIndex] = useState(null);
      const [adminOpen, setAdminOpen] = useState(false);

      useEffect(() => {
        const handleHashCheck = () => {
          if (window.location.hash === '#admin' || window.location.pathname.endsWith('/admin')) {
            setAdminOpen(true);
          }
        };
        handleHashCheck();
        window.addEventListener('hashchange', handleHashCheck);
        return () => window.removeEventListener('hashchange', handleHashCheck);
      }, []);

      const handleOpenBooking = (svc = 'Wedding Photography') => {
        setSelectedService(svc);
        setBookingOpen(true);
      };

      const handleOpenLightbox = (imgs, idx) => {
        setLbImages(imgs);
        setLbIndex(idx);
      };

      useEffect(() => {
        const revealElements = document.querySelectorAll('.reveal-left, .reveal-right, .reveal-up');
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, { threshold: 0.12 });

        revealElements.forEach(el => revealObserver.observe(el));
        return () => revealObserver.disconnect();
      }, []);

      return (
        <div>
          <Navbar onOpenBooking={handleOpenBooking} />
          <main>
            {/* 1. Home (#home) */}
            <Hero onOpenBooking={handleOpenBooking} />
            
            {/* 2. About Us (#about) */}
            <TrustStats />
            <AboutSection onOpenBooking={handleOpenBooking} />
            <WhyChooseUs />

            {/* 3. Services (#services) */}
            <ServicesSection onSelectService={handleOpenBooking} />

            {/* 5. Customized Gifts (#gifts) */}
            <CustomizedGifts onSelectService={handleOpenBooking} />

            {/* 6. Frame Works (#frames) */}
            <PhotoFrameVisualizer onSelectService={handleOpenBooking} />

            {/* 7. Album Making (#album) */}
            <AlbumSection onSelectService={handleOpenBooking} />

            {/* 8. Gallery (#gallery) */}
            <Gallery onOpenLightbox={handleOpenLightbox} />

            {/* 9. Contact Us (#contact) */}
            <Testimonials />
            <CTASection onOpenBooking={handleOpenBooking} />
            <ContactSection selectedService={selectedService} />
          </main>
          <Footer onOpenAdmin={() => setAdminOpen(true)} />
          <BookingModal isOpen={bookingOpen} onClose={() => setBookingOpen(false)} initialService={selectedService} />
          <LightboxModal images={lbImages} index={lbIndex} onClose={() => setLbIndex(null)} onPrev={() => setLbIndex(prev => prev === 0 ? lbImages.length - 1 : prev - 1)} onNext={() => setLbIndex(prev => prev === lbImages.length - 1 ? 0 : prev + 1)} />
          <AdminModal isOpen={adminOpen} onClose={() => { setAdminOpen(false); if (window.location.hash === '#admin') window.location.hash = ''; }} />
          <FloatingActions onOpenBooking={handleOpenBooking} />
        </div>
      );
    }

    function App() {
      return (
        <DataProvider>
          <AppContent />
        </DataProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Vite Module Entrypoint for Dev Server -->
  <script type="module" src="/src/main.jsx"></script>

    // 2. TRUST STATS & ABOUT COMPONENT (#about)
    function TrustStats() {
      const [counts, setCounts] = useState(siteConfig.stats.map(() => 0));
      const sectionRef = useRef(null);
      const [animated, setAnimated] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting && !animated) {
            setAnimated(true);
            siteConfig.stats.forEach((stat, idx) => {
              let current = 0;
              const step = stat.number / 30;
              const timer = setInterval(() => {
                current += step;
                if (current >= stat.number) {
                  current = stat.number;
                  clearInterval(timer);
                }
                setCounts(prev => {
                  const next = [...prev];
                  next[idx] = Math.floor(current);
                  return next;
                });
              }, 50);
            });
          }
        }, { threshold: 0.2 });

        if (sectionRef.current) observer.observe(sectionRef.current);
        return () => observer.disconnect();
      }, [animated]);

      return (
        <section ref={sectionRef} className="trust-stats-section">
          <div className="container">
            <div className="stats-grid">
              {siteConfig.stats.map((stat, idx) => (
                <div key={idx} className={`stat-item reveal-up delay-${(idx % 4) + 1}`}>
                  <div className="stat-number">{counts[idx]}{stat.suffix}</div>
                  <div className="stat-label">{stat.label}</div>
                  <div className="stat-desc">{stat.desc}</div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

                  <li><a href="#gifts" className="footer-link">3D Desktop Plaques & Standees</a></li>
                  <li><a href="#services" className="footer-link">Pre-Wedding Shoots</a></li>
                  <li><a href="#services" className="footer-link">Professional Studio Portraits</a></li>
                </ul>
              </div>

              <div>
                <h4 className="footer-title">Studio Contact</h4>
                <ul className="footer-contact-list">
                  <li>
                    <Icon name="map-pin" size={16} color="#D4AF37" className="f-icon" />
                    <span>{siteConfig.contact.address}</span>
                  </li>
                  <li>
                    <Icon name="phone" size={16} color="#D4AF37" className="f-icon" />
                    <span>
                      <a href={`tel:${siteConfig.contact.phoneRaw}`}>{siteConfig.contact.phonePrimaryDisplay}</a>
                      <br />
                      <a href={`tel:${siteConfig.contact.phoneSecondaryRaw}`}>{siteConfig.contact.phoneSecondaryDisplay}</a>
                    </span>
                  </li>
                  <li>
                    <Icon name="mail" size={16} color="#D4AF37" className="f-icon" />
                    <a href={`mailto:${siteConfig.contact.email}`}>{siteConfig.contact.email}</a>
                  </li>
                </ul>

                <div style={{ marginTop: '1.25rem' }}>
                  <a href={googleMapsUrl} target="_blank" rel="noopener noreferrer" className="btn btn-gold" style={{ fontSize: '0.82rem', padding: '0.6rem 1.1rem', width: '100%', justifyContent: 'center' }}>
                    <Icon name="map" size={14} />
                    <span>Open Google Maps Directions</span>
                  </a>
                </div>
              </div>
            </div>

            <div className="footer-bottom">
              <div className="footer-bottom-copy">
                &copy; 2026 <strong>{siteConfig.businessFullTitle}</strong>. All Rights Reserved.
              </div>

              <div className="footer-bottom-links">
                <a href={googleReviewsUrl} target="_blank" rel="noopener noreferrer" className="footer-b-link">
                  Read Google Reviews
                </a>
                <span className="b-dot">•</span>
                <a href={siteConfig.social.whatsapp} target="_blank" rel="noopener noreferrer" className="footer-b-link">
                  WhatsApp Support
                </a>
              </div>

              <button onClick={scrollToTop} className="back-to-top-btn" title="Back to Top">
                <Icon name="arrow-up" size={16} />
                <span>Back to Top</span>
              </button>
            </div>
          </div>
        </footer>
      );
    }

    // BOOKING MODAL (VIP STEP WIZARD)
    function BookingModal({ isOpen, onClose, initialService }) {
      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        service: initialService || 'Wedding Photography',
        date: '',
        location: '',
        notes: ''
      });
      const [submitted, setSubmitted] = useState(false);
      const [submittedWaUrl, setSubmittedWaUrl] = useState('');

      useEffect(() => {
        if (initialService) setFormData(prev => ({ ...prev, service: initialService }));
        setStep(1);
        setSubmitted(false);
        setSubmittedWaUrl('');
      }, [initialService, isOpen]);

      if (!isOpen) return null;

      const servicesList = [
        { id: 'Wedding Photography', title: 'Wedding Photography', icon: 'camera', desc: 'Complete candid & traditional coverage' },
        { id: 'Luxury Album Making', title: 'Luxury Album Making', icon: 'book-open', desc: 'Flush mount leather & acrylic photobooks' },
        { id: 'Customized Photo Frames', title: 'Photo Frame Works', icon: 'image', desc: 'Wooden carved & gold filigree frames' },
        { id: 'Customized Gifts', title: 'Customized Gifts', icon: 'gift', desc: '3D plaques, LED standees & memory boxes' },
        { id: 'Pre-Wedding Shoot', title: 'Pre-Wedding Shoot', icon: 'heart', desc: 'Outdoor garden & seashore shoots' },
        { id: 'Professional Studio Services', title: 'Studio Services', icon: 'clock', desc: 'In-studio portraits & instant prints' }
      ];

      const handleSubmit = (e) => {
        e.preventDefault();
        
        const rawMessage = 
          `\uD83D\uDCF8 *SIVAM DIGITAL - NEW BOOKING ENQUIRY* \uD83D\uDCF8\n\n` +
          `\u2022 *Name:* ${formData.name}\n` +
          `\u2022 *Phone:* ${formData.phone}\n` +
          `\u2022 *Service Selected:* ${formData.service}\n` +
          `\u2022 *Event Date:* ${formData.date || 'Flexible Date'}\n` +
          `\u2022 *Location:* ${formData.location || 'Ramanathapuram'}\n` +
          `\u2022 *Notes:* ${formData.notes || 'None'}\n\n` +
          `\u2728 *Please confirm availability & pricing for my event!*`;
        
        const waUrl = `https://api.whatsapp.com/send?phone=${siteConfig.contact.whatsappRaw}&text=${encodeURIComponent(rawMessage)}`;

        setSubmittedWaUrl(waUrl);
        setSubmitted(true);

        try {
          const win = window.open(waUrl, '_blank');
          if (!win || win.closed || typeof win.closed === 'undefined') {
            window.location.href = waUrl;
          }
        } catch (err) {
          window.location.href = waUrl;
        }
      };

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="booking-modal-card" onClick={e => e.stopPropagation()}>
            <button className="modal-close-btn" onClick={onClose} aria-label="Close">
              <Icon name="x" size={20} />
            </button>

            {submitted ? (
              <div className="booking-success-view">
                <div className="success-icon-wrap">
                  <Icon name="check-circle" size={54} color="#D4AF37" />
                </div>
                <h3 className="success-title">Booking Request Initiated!</h3>
                <p className="success-desc">
                  Connecting you to <strong>Sivam Digital Studio & Frame Works</strong> on WhatsApp to confirm your date...
                </p>
                <div className="booking-summary-box">
                  <div className="summary-row"><span>Service:</span><strong>{formData.service}</strong></div>
                  <div className="summary-row"><span>Name:</span><strong>{formData.name}</strong></div>
                  <div className="summary-row"><span>Date:</span><strong>{formData.date || 'Flexible Date'}</strong></div>
                </div>
                <div className="success-actions">
                  <a href={submittedWaUrl || `https://api.whatsapp.com/send?phone=${siteConfig.contact.whatsappRaw}`} target="_blank" rel="noopener noreferrer" className="btn btn-gold" style={{ width: '100%' }}>
                    <Icon name="message-square" size={18} /><span>Open WhatsApp Now</span>
                  </a>
                  <button className="btn btn-dark" onClick={() => { setSubmitted(false); setStep(1); onClose(); }} style={{ width: '100%' }}>
                    Close Window
                  </button>
                </div>
              </div>
            ) : (
              <div>
                <div className="modal-header-box">
                  <div className="modal-badge"><Icon name="sparkles" size={14} color="#D4AF37" /> VIP APPOINTMENT BOOKING</div>
                  <h3 className="modal-main-title">Book Your Experience</h3>
                  <p className="modal-sub-desc">Reserve your date with Ramanathapuram's trusted studio</p>
                </div>

                <div className="step-progress-bar">
                  <div className={`step-pill ${step >= 1 ? 'active' : ''}`}><span className="step-num">1</span><span className="step-txt">Service</span></div>
                  <div className="step-line"></div>
                  <div className={`step-pill ${step >= 2 ? 'active' : ''}`}><span className="step-num">2</span><span className="step-txt">Details</span></div>
                  <div className="step-line"></div>
                  <div className={`step-pill ${step >= 3 ? 'active' : ''}`}><span className="step-num">3</span><span className="step-txt">Contact</span></div>
                </div>

                {step === 1 && (
                  <div className="wizard-step-content">
                    <label className="wizard-label">Choose Service Category *</label>
                    <div className="services-selector-grid">
                      {servicesList.map(item => {
                        const isSelected = formData.service === item.id;
                        return (
                          <div key={item.id} onClick={() => setFormData({ ...formData, service: item.id })} className={`service-option-card ${isSelected ? 'selected' : ''}`}>
                            <div className="option-icon-box"><Icon name={item.icon} size={20} color={isSelected ? '#121418' : '#D4AF37'} /></div>
                            <div>
                              <div className="option-title">{item.title}</div>
                              <div className="option-desc">{item.desc}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div className="wizard-footer">
                      <button type="button" onClick={() => setStep(2)} className="btn btn-gold" style={{ width: '100%', justifyContent: 'center' }}>
                        <span>Next: Event Date & Location</span><Icon name="arrow-right" size={18} />
                      </button>
                    </div>
                  </div>
                )}

                {step === 2 && (
                  <div className="wizard-step-content">
                    <div className="form-group">
                      <label className="form-label">Event / Booking Date *</label>
                      <input type="date" required className="form-input" value={formData.date} onChange={e => setFormData({ ...formData, date: e.target.value })} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Event Location / City</label>
                      <input type="text" placeholder="e.g. Ramanathapuram, Paramakudi..." className="form-input" value={formData.location} onChange={e => setFormData({ ...formData, location: e.target.value })} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Special Requirements / Notes</label>
                      <textarea rows="2" placeholder="Specific requirements..." className="form-textarea" value={formData.notes} onChange={e => setFormData({ ...formData, notes: e.target.value })}></textarea>
                    </div>
                    <div className="wizard-footer flex-row">
                      <button type="button" onClick={() => setStep(1)} className="btn btn-dark" style={{ flex: 1 }}>
                        <Icon name="arrow-left" size={16} /><span>Back</span>
                      </button>
                      <button type="button" onClick={() => setStep(3)} className="btn btn-gold" style={{ flex: 1.5 }}>
                        <span>Next: Contact Info</span><Icon name="arrow-right" size={18} />
                      </button>
                    </div>
                  </div>
                )}

                {step === 3 && (
                  <form onSubmit={handleSubmit} className="wizard-step-content">
                    <div className="form-group">
                      <label className="form-label">Your Name *</label>
                      <input type="text" required placeholder="Your Full Name" className="form-input" value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Phone Number *</label>
                      <input type="tel" required placeholder="+91 98765 43210" className="form-input" value={formData.phone} onChange={e => setFormData({ ...formData, phone: e.target.value })} />
                    </div>
                    <div className="trust-guarantee-pill">
                      <Icon name="shield-check" size={18} color="#34A853" />
                      <span>Free consultation • Instant date check • 5+ Years Trust</span>
                    </div>
                    <div className="wizard-footer flex-row">
                      <button type="button" onClick={() => setStep(2)} className="btn btn-dark" style={{ flex: 1 }}>
                        <Icon name="arrow-left" size={16} /><span>Back</span>
                      </button>
                      <button type="submit" className="btn btn-gold" style={{ flex: 1.8 }}>
                        <Icon name="send" size={16} /><span>Confirm Booking</span>
                      </button>
                    </div>
                  </form>
                )}

                <div className="modal-quick-call-footer">
                  <span>Need instant discussion over phone?</span>
                  <a href={`tel:${siteConfig.contact.phoneRaw}`} className="quick-call-link">
                    <Icon name="phone" size={14} /> Call {siteConfig.contact.phonePrimaryDisplay}
                  </a>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // FLOATING ACTIONS
    function FloatingActions({ onOpenBooking }) {
      return (
        <React.Fragment>
          <div className="desktop-floating-actions">
            <a href={siteConfig.social.instagram} target="_blank" rel="noopener noreferrer" className="float-action-btn float-insta" title="Instagram Page" style={{ background: 'linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%)', color: '#fff' }}>
              <Icon name="instagram" size={22} color="#fff" />
            </a>
            <a href={siteConfig.social.whatsapp} target="_blank" rel="noopener noreferrer" className="float-action-btn float-whatsapp" title="WhatsApp Chat">
              <Icon name="message-square" size={24} />
            </a>
            <a href={`tel:${siteConfig.contact.phoneRaw}`} className="float-action-btn float-call" title="Call Sivam Digital">
              <Icon name="phone" size={22} />
            </a>
          </div>

          <div className="mobile-bottom-bar">
            <div className="mobile-bar-actions">
              <a href={`tel:${siteConfig.contact.phoneRaw}`} className="btn btn-dark" style={{ flex: 1, padding: '0.6rem' }}>
                <Icon name="phone" size={14} /><span>Call</span>
              </a>
              <a href={siteConfig.social.whatsapp} target="_blank" rel="noopener noreferrer" className="btn btn-dark" style={{ flex: 1, padding: '0.6rem', color: '#25D366' }}>
                <Icon name="message-square" size={14} /><span>WhatsApp</span>
              </a>
              <button className="btn btn-gold" style={{ flex: 1.2, padding: '0.6rem' }} onClick={() => onOpenBooking()}>
                <Icon name="calendar" size={14} /><span>Book Now</span>
              </button>
            </div>
          </div>
        </React.Fragment>
      );
    }

    // MAIN APP COMPONENT STRICTLY ALIGNED WITH HEADER MENU ORDER
    function App() {
      const [bookingOpen, setBookingOpen] = useState(false);
      const [selectedService, setSelectedService] = useState('Wedding Photography');
      const [lbImages, setLbImages] = useState([]);
      const [lbIndex, setLbIndex] = useState(null);

      const handleOpenBooking = (svc = 'Wedding Photography') => {
        setSelectedService(svc);
        setBookingOpen(true);
      };

      const handleOpenLightbox = (imgs, idx) => {
        setLbImages(imgs);
        setLbIndex(idx);
      };

      // INTERSECTION OBSERVER SCROLL-REVEAL SCRIPT
      useEffect(() => {
        const revealElements = document.querySelectorAll('.reveal-left, .reveal-right, .reveal-up');
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
            }
          });
        }, { threshold: 0.12 });

        revealElements.forEach(el => revealObserver.observe(el));
        return () => revealObserver.disconnect();
      }, []);

      return (
        <div>
          <Navbar onOpenBooking={handleOpenBooking} />
          <main>
            {/* 1. Home (#home) */}
            <Hero onOpenBooking={handleOpenBooking} />
            
            {/* 2. About Us (#about) */}
            <TrustStats />
            <AboutSection onOpenBooking={handleOpenBooking} />
            <WhyChooseUs />

            {/* 3. Services (#services) */}
            <ServicesSection onSelectService={handleOpenBooking} />

            {/* 5. Customized Gifts (#gifts) */}
            <CustomizedGifts onSelectService={handleOpenBooking} />

            {/* 6. Frame Works (#frames) */}
            <PhotoFrameVisualizer onSelectService={handleOpenBooking} />

            {/* 7. Album Making (#album) */}
            <AlbumSection onSelectService={handleOpenBooking} />

            {/* 8. Gallery (#gallery) */}
            <Gallery onOpenLightbox={handleOpenLightbox} />

            {/* 9. Contact Us (#contact) */}
            <Testimonials />
            <CTASection onOpenBooking={handleOpenBooking} />
            <ContactSection selectedService={selectedService} />
          </main>
          <Footer />
          <BookingModal isOpen={bookingOpen} onClose={() => setBookingOpen(false)} initialService={selectedService} />
          <LightboxModal images={lbImages} index={lbIndex} onClose={() => setLbIndex(null)} onPrev={() => setLbIndex(prev => prev === 0 ? lbImages.length - 1 : prev - 1)} onNext={() => setLbIndex(prev => prev === lbImages.length - 1 ? 0 : prev + 1)} />
          <FloatingActions onOpenBooking={handleOpenBooking} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
